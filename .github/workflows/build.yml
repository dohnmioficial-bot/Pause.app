name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Montar projeto Android
        run: |
          mkdir -p proj/app/src/main/java/com/exemplo/pausa
          cp BloqueioService.kt MainActivity.kt Pin.kt ChromeGuardService.kt proj/app/src/main/java/com/exemplo/pausa/
          cp AndroidManifest.xml proj/app/src/main/

          mkdir -p proj/app/src/main/res/xml
          cat > proj/app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="300"
              android:description="@string/pausa_descricao" />
          EOF

          mkdir -p proj/app/src/main/res/values
          cat > proj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="pausa_descricao">Lê o endereço do site aberto no Chrome para mostrar uma pausa antes de sites novos. Nada sai do aparelho.</string>
          </resources>
          EOF

          cat > proj/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Pausa"
          include(":app")
          EOF

          cat > proj/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          kotlin.code.style=official
          EOF

          cat > proj/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.exemplo.pausa"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.exemplo.pausa"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Compilar APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Pausa-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
